# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - python-test-3

on:
  push:
    branches:
      - setuppy
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.13'        # Set the python version to use
  AZURE_WEBAPP_NAME: 'python-test-3'     # Set this to your application's name
  WORKING_DIRECTORY: '.'        # Set this to the path which is to be deployed to Web App. Defaults to the repository root
  STARTUP_COMMAND: 'uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}'           # Set this to the startup command required to start the application. Default used is gunicorn for Flask/Django apps
  SLOT_NAME: 'Production'    # Set this to your deployment slot name, default is 'Production'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # This is required for requesting the JWT
      contents: read    # This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4


      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}


      - name: Create and Start virtual environment and Install dependencies with setup.py
        run: |
          pip install --upgrade pip setuptools wheel
          python -m venv antenv
          source antenv/bin/activate
          pip install -e .


      # If the SCM_DO_BUILD_DURING_DEPLOYMENT setting is enabled (set to true), the platform uses Oryx during deployment to build the application and install dependencies (for example, running `pip install`). Since the build happens on the platform, we exclude the antenv virtual environment folder from the deployment package. This helps reduce the size of the deployment artifact and avoids sending unnecessary files that will be recreated during the build process.
      - name: Cleanup Venv for Deployment
        run: |
          rm -rf antenv


      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8E1869C91B1541E99FD05B914E9578F7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B51D6DAEE8CD4AA9A33D9181F75C6C9A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_019C06D9CD2542FDBDAAC9BFB4D2BEC4 }}


      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.WORKING_DIRECTORY }}
          slot-name: ${{ env.SLOT_NAME }}
          startup-command: ${{ env.STARTUP_COMMAND }}

          
