# Poetry version of pyproject.toml
# To use this file, rename it to pyproject.toml or copy its contents
[tool.poetry]
name = "fastapi-sample"
version = "0.1.0"
description = "A simple FastAPI application with hello world and calculator endpoints"
authors = ["Your Name <your.email@example.com>"]
maintainers = ["Your Name <your.email@example.com>"]
license = "MIT"
package-mode = false
readme = "README.md"
homepage = "https://github.com/yourusername/fastapi-sample"
repository = "https://github.com/yourusername/fastapi-sample"
documentation = "https://github.com/yourusername/fastapi-sample#readme"
keywords = ["fastapi", "api", "calculator", "hello-world"]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic = "^2.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
httpx = "^0.24.0"
black = "^23.0.0"
flake8 = "^6.0.0"
mypy = "^1.5.0"

[tool.poetry.scripts]
fastapi-sample = "main:app"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"



