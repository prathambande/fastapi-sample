# Standard PEP 621 pyproject.toml (non-Poetry version)
[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-sample"
version = "0.1.0"
description = "A simple FastAPI application with hello world and calculator endpoints"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
maintainers = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["fastapi", "api", "calculator", "hello-world"]
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "pydantic==2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/fastapi-sample"
Documentation = "https://github.com/yourusername/fastapi-sample#readme"
Repository = "https://github.com/yourusername/fastapi-sample"
Issues = "https://github.com/yourusername/fastapi-sample/issues"

[project.scripts]
fastapi-sample = "main:app"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'


